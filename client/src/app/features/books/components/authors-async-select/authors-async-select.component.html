<ng-select
  [items]="authors"
  [virtualScroll]="true"
  bindValue="id"
  [loading]="loading"
  appendTo="body"
  (scroll)="onScroll($event)"
  (scrollToEnd)="onScrollToEnd()"
  (change)="onSelectChange($event)" 
>
  <ng-template ng-label-tmp let-item="item">
    {{ authorToString(item) }}
  </ng-template>
  <ng-template ng-option-tmp let-item="item">
    {{ authorToString(item) }}
  </ng-template>
</ng-select>
